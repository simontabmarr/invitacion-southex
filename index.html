<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acceso restringido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ====== EDITAR ACÁ ====== */
:root{
  --brand:#e5202a;      /* rojo del logo */
  --blue:#0f7bb8;       /* azul del logo */
  --sky:#6fa8d6;        /* celeste del logo */
  --paper:#f2f2f2;
  --ink:#000;
  --display:'Bebas Neue',Impact,sans-serif;
  --type:'DM Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:var(--paper);font-family:var(--type);overflow:hidden}
body{-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .8s}
.scene.on{opacity:1;visibility:visible}
.grain{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.12;mix-blend-mode:screen;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:g .6s steps(3) infinite}
@keyframes g{33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}}
.vig{position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 45%,#000 120%)}
.logo{height:clamp(44px,13vw,76px);display:flex;align-items:center}
.logo img{height:100%;filter:brightness(0) invert(1)}
.logo b{font:400 clamp(34px,9vw,52px)/1 var(--display);letter-spacing:.18em}

/* Escena 1: mira */
#s1 svg{width:min(78vw,380px);height:auto}
.ring{fill:none;stroke:var(--paper);stroke-width:1.2}
.rifle{stroke:var(--paper);stroke-width:.8;opacity:.5}
#scan{transform-origin:150px 150px;animation:sc 5s ease-in-out forwards}
@keyframes sc{0%{transform:translate(-90px,70px) scale(1.5)}35%{transform:translate(60px,-50px) scale(1.2)}65%{transform:translate(-30px,25px) scale(1.1)}100%{transform:translate(0,0) scale(1)}}
#lock{fill:none;stroke:var(--brand);stroke-width:2.5;opacity:0;animation:lk .3s 4.6s forwards}
@keyframes lk{to{opacity:1}}
#s1 .cap{color:var(--sky);margin-top:22px;font-size:14px;letter-spacing:.2em;min-height:1.4em;text-align:center}
#s1.hit::after{content:"";position:fixed;inset:0;background:var(--brand);animation:hit 1s forwards;z-index:5}
@keyframes hit{0%{opacity:.9}100%{opacity:0}}

/* Escena 2: expediente */
#s2 .lines{width:min(92vw,460px);font-size:clamp(14px,3.8vw,17px);line-height:1.8;white-space:pre-wrap;min-height:11em}
#s2 .lines i{color:var(--brand);font-style:normal}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--paper);vertical-align:-.2em;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}

/* Escena 3: contador */
#s3 .top{font:400 clamp(26px,8vw,40px)/1 var(--display);letter-spacing:.14em;border:3px solid var(--paper);padding:.25em .6em;transform:rotate(-3deg);margin:22px 0 8px}
#s3 p.sub{font-size:14px;letter-spacing:.12em;opacity:.8;text-align:center;max-width:30ch}
.clock{display:flex;gap:clamp(8px,3vw,22px);margin:34px 0 26px}
.unit{text-align:center}
.pair{display:flex;gap:4px}
.unit small{color:var(--sky);display:block;margin-top:10px;font-size:11px;letter-spacing:.2em;opacity:.7}
.card{position:relative;width:clamp(34px,10.5vw,64px);height:clamp(52px,16vw,96px);font:400 clamp(44px,13.5vw,82px)/1 var(--display);perspective:400px}
.card>div,.flap>div{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--paper);color:var(--ink);text-align:center}
.card .t{top:0;border-radius:5px 5px 0 0}.card .b{bottom:0;border-radius:0 0 5px 5px;background:#d9d9d9}
.card span{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center}
.t span{top:0}.b span{bottom:0}
.card::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#000;z-index:4;transform:translateY(-1px)}
.flap{position:absolute;left:0;right:0;top:0;height:50%;z-index:3;transform-origin:bottom;transform-style:preserve-3d}
.flap.go{animation:fall .55s ease-in forwards}
.flap>div{backface-visibility:hidden;height:100%}
.flap .f{top:0;border-radius:5px 5px 0 0}
.flap .k{top:0;transform:rotateX(180deg);background:#d9d9d9;border-radius:0 0 5px 5px}
.flap .f span{top:0;height:200%}
.flap .k span{bottom:0;height:200%}
@keyframes fall{to{transform:rotateX(-180deg)}}
.sep{align-self:center;font:400 40px var(--display);opacity:.5;margin-bottom:22px}

/* Revelación */
#s4{background:#000;overflow:auto;justify-content:flex-start;padding-top:max(48px,env(safe-area-inset-top))}
.stamp{font:400 clamp(38px,13vw,80px)/1 var(--display);letter-spacing:.06em;color:var(--brand);border:6px solid var(--brand);padding:.1em .3em;transform:rotate(-8deg) scale(3);opacity:0;margin:44px 0 30px;text-align:center}
#s4.on .stamp{animation:slam .5s .3s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes slam{to{transform:rotate(-8deg) scale(1);opacity:.95}}
.doc{width:min(92vw,460px);background:var(--paper);color:var(--ink);padding:26px 24px;opacity:0;transform:translateY(30px);font-size:16px;line-height:1.7}
#s4.on .doc{animation:up .9s 1.2s forwards}
@keyframes up{to{opacity:1;transform:none}}
.doc h2{font:400 30px/1 var(--display);letter-spacing:.08em;margin-bottom:14px}
.doc dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.doc dt{color:var(--blue);font-family:var(--display);letter-spacing:.1em;font-size:19px}
.doc .redact{background:#000;color:#000;user-select:none;padding:0 .4em}
.doc p{margin-top:16px;border-top:2px solid #000;padding-top:14px}
.doc .brandbar{height:8px;background:linear-gradient(90deg,var(--blue) 0 70%,var(--brand) 70%);margin:-26px -24px 20px}.clogo{display:block;height:46px;margin-bottom:18px}

.doc{padding:0}.doc img{display:block;width:100%;height:auto}
.doc .prog{margin:0;border:0;height:10px;background:#cfcfcf}
.prog{height:8px;border:1px solid #000;margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;width:30%;background:var(--blue);animation:pr 2.4s ease-in-out infinite alternate}
@keyframes pr{from{width:28%}to{width:40%}}
.status{font-size:13px;letter-spacing:.2em;color:var(--sky);text-align:center;margin:-8px 0 22px;opacity:0}
#s4.on .status{animation:up .8s .9s forwards}
.nextlbl{color:var(--sky);font-size:13px;letter-spacing:.2em;margin-top:30px;opacity:0;text-align:center}
#s4 .clock{margin:16px 0 56px;opacity:0}
#s4.on .nextlbl,#s4.on .clock{animation:up .8s 1.7s forwards}

/* Credencial */
.badge{width:min(80vw,330px);background:#f2f2f2;color:#000;border-radius:16px;position:relative;overflow:hidden;opacity:0;transform-origin:50% -30px;box-shadow:0 18px 50px #000a}
#s4.on .badge{animation:drop 1.5s 1.1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes drop{0%{opacity:0;transform:translateY(-70px) rotate(-9deg)}40%{opacity:1;transform:translateY(0) rotate(5deg)}65%{transform:rotate(-3deg)}85%{transform:rotate(1.4deg)}100%{opacity:1;transform:none}}
.badge .slot{width:64px;height:12px;border-radius:8px;background:#000;margin:12px auto 0}
.badge .hd{padding:14px 18px 12px}
.badge .hd img{height:34px;display:block}
.badge .pass{display:flex;justify-content:space-between;background:#000;color:#f2f2f2;font:400 20px/1 var(--display);letter-spacing:.14em;padding:9px 18px}
.badge .pass span:last-child{color:var(--brand)}
.badge .body{display:flex;gap:14px;padding:16px 18px 14px}
.badge .photo{flex:none;width:84px;height:104px;background:#000;border-radius:6px;position:relative;overflow:hidden}
.badge .photo::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--sky);box-shadow:0 0 10px var(--sky);animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{from{top:0}to{top:calc(100% - 3px)}}
.badge dl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-content:start;font-size:14px;line-height:1.5}
.badge dt{font:400 16px/1.5 var(--display);letter-spacing:.1em;color:var(--blue)}
.badge dd.date{color:var(--brand);font-weight:500}
.badge .holo{height:8px;background:linear-gradient(90deg,var(--blue) 0 65%,var(--brand) 65%)}
.badge .barcode{height:34px;margin:12px 18px 16px;background:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 5px,#000 5px 6px,transparent 6px 9px,#000 9px 12px,transparent 12px 14px)}
.prog.b{width:min(80vw,330px);margin-top:22px;border:1px solid #fff6;background:#111;opacity:0}
#s4.on .prog.b{animation:up .8s 1.7s forwards}
#s4{padding-top:max(36px,env(safe-area-inset-top))}
#s4>*{flex:none}
.stamp{white-space:nowrap}
.badge .pass{gap:10px;font-size:18px;letter-spacing:.1em;white-space:nowrap}
#skip{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:60;background:none;border:1px solid #fff5;color:#fff9;font:12px var(--type);padding:8px 12px;letter-spacing:.1em}
#skip:focus-visible{outline:2px solid var(--brand)}
@media (prefers-reduced-motion:reduce){.grain{animation:none}#scan{animation-duration:1s}}
</style>
</head>
<body>
<div class="grain"></div><div class="vig"></div>

<!-- Escena 1: mira -->
<section class="scene on" id="s1" aria-label="Verificando acceso">
  <svg viewBox="0 0 300 300" aria-hidden="true">
    <circle class="ring" cx="150" cy="150" r="140"/><circle class="ring" cx="150" cy="150" r="118" style="stroke:#0f7bb8;opacity:.9"/>
    <circle class="ring" cx="150" cy="150" r="96" style="stroke:#6fa8d6;opacity:.5"/>
    <g class="rifle"><line x1="150" y1="10" x2="150" y2="290"/><line x1="10" y1="150" x2="290" y2="150"/>
      <line x1="51" y1="51" x2="249" y2="249"/><line x1="249" y1="51" x2="51" y2="249"/></g>
    <g id="scan">
      <circle class="ring" cx="150" cy="150" r="46" stroke-width="2"/>
      <path d="M150 90v40M150 170v40M90 150h40M170 150h40" stroke="#6fa8d6" stroke-width="2"/>
      <circle id="lock" cx="150" cy="150" r="58"/>
      <circle cx="150" cy="150" r="2.5" fill="#e5202a"/>
    </g>
    <!-- silueta -->
    <g fill="#f2f2f2" opacity=".9"><circle cx="150" cy="128" r="11"/><path d="M128 190c0-24 9-45 22-45s22 21 22 45z"/></g>
  </svg>
  <div class="cap" id="cap1">ESCANEANDO…</div>
</section>

<!-- Escena 2: expediente -->
<section class="scene" id="s2" aria-label="Acceso">
  <div class="lines" id="lines"></div>
</section>

<!-- Escena 3: contador -->
<section class="scene" id="s3" aria-label="Cuenta regresiva">
  <div class="logo" id="logo1"><img src="logo.png" alt="Grupo Southex" onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'SOUTHEX'}))"></div>
  <div class="top">TOP SECRET</div>
  <p class="sub">Tu invitación se revela en</p>
  <div class="clock" id="clock" role="timer" aria-live="off"></div>
  <p class="sub" style="font-size:12px;opacity:.55">Mantené este link. Volvé cuando llegue a cero.</p>
</section>

<!-- Revelación parcial: credencial -->
<section class="scene" id="s4" aria-label="Invitación">
  <div class="stamp">TOP SECRET</div>
  <div class="status">INFORMACIÓN PARCIALMENTE DESENCRIPTADA</div>
  <div class="badge" role="img" aria-label="Pase de acceso de invitado. Fecha: jueves 03/12. Evento, hora y lugar censurados.">
    <div class="slot"></div>
    <div class="hd"><img src="logo.png" alt="Grupo Southex"></div>
    <div class="pass"><span>PASE DE ACCESO</span><span>INVITADO</span></div>
    <div class="body">
      <div class="photo"><svg viewBox="0 0 84 104" aria-hidden="true"><g fill="#f2f2f2"><circle cx="42" cy="40" r="16"/><path d="M10 104c0-30 14-48 32-48s32 18 32 48z"/></g></svg></div>
      <dl>
        <dt>Evento</dt><dd><span class="redact">██████████</span></dd>
        <dt>Fecha</dt><dd class="date">Jueves 03/12</dd>
        <dt>Hora</dt><dd><span class="redact">█████</span></dd>
        <dt>Lugar</dt><dd><span class="redact">████████████</span></dd>
      </dl>
    </div>
    <div class="holo"></div>
    <div class="barcode"></div>
  </div>
  <div class="prog b"><i></i></div>
  <p class="nextlbl" id="nextlbl">Próxima actualización en</p>
  <div class="clock" id="clock2" role="timer" aria-live="off"></div>
</section>

<button id="skip" aria-label="Saltar introducción">SALTAR</button>

<script>
/* ====== EDITAR ACÁ ======
   Horas de Argentina (-03:00).
   T1: primera revelación (la invitación se abre con la fecha).
   T2: próxima actualización (el contador de la pantalla final).
   Pruebas: ?reveal salta a la pantalla final · ?t=30 contador inicial de 30 s
            ?next=20 el segundo contador termina en 20 s */
let T1 = new Date('2026-11-24T17:00:00-03:00');
let T2 = new Date('2026-11-25T17:45:00-03:00');
const params = new URLSearchParams(location.search);
if(params.get('t')){ T1 = new Date(Date.now()+(+params.get('t'))*1000); T2 = new Date(+T1+60000); }
if(params.get('next')){ T2 = new Date(Date.now()+(+params.get('next'))*1000); }

const $ = s => document.querySelector(s);
const scenes = ['s1','s2','s3','s4'];
let timers = [], revealed = false;
const later = (fn,ms) => timers.push(setTimeout(fn,ms));
function show(id){ scenes.forEach(s => $('#'+s).classList.toggle('on', s===id)); }

/* Reloj de cartoncitos */
function cardHTML(n,o){
  return `<div class="t"><span>${n}</span></div><div class="b"><span>${o}</span></div>
  <div class="flap"><div class="f"><span>${o}</span></div><div class="k"><span>${n}</span></div></div>`;
}
function setCard(el,val,first){
  const old = el.dataset.v ?? val;
  if(first || old===val){ el.innerHTML = cardHTML(val,val); el.dataset.v = val; return; }
  el.innerHTML = cardHTML(val,old);
  const flap = el.querySelector('.flap'); void flap.offsetWidth; flap.classList.add('go');
  setTimeout(()=>{ el.innerHTML = cardHTML(val,val); },560);
  el.dataset.v = val;
}
function makeClock(el, list){
  list.forEach(([k,l],i)=>{
    if(i) el.insertAdjacentHTML('beforeend','<div class="sep">:</div>');
    el.insertAdjacentHTML('beforeend',`<div class="unit"><div class="pair" data-k="${k}">${'<div class="card"></div>'.repeat(2)}</div><small>${l}</small></div>`);
  });
  let first = true;
  return secs => {
    const hasD = list.some(u=>u[0]==='d');
    const v = {d:Math.floor(secs/86400), h:hasD?Math.floor(secs%86400/3600):Math.floor(secs/3600), m:Math.floor(secs%3600/60), s:secs%60};
    list.forEach(([k])=>{
      const str = String(v[k]).padStart(2,'0');
      const cards = el.querySelector(`[data-k="${k}"]`).children;
      [0,1].forEach(i=>setCard(cards[i],str[i],first));
    });
    first = false;
  };
}
const clock1 = makeClock($('#clock'),[['d','DÍAS'],['h','HORAS'],['m','MIN'],['s','SEG']]);
const clock2 = makeClock($('#clock2'),[['h','HORAS'],['m','MIN'],['s','SEG']]);

function tick(){
  const n = Date.now();
  clock1(Math.max(0,Math.floor((T1-n)/1000)));
  clock2(Math.max(0,Math.floor((T2-n)/1000)));
  if(n>=T2) $('#nextlbl').textContent = 'Nueva información en camino';
  if(n>=T1 && !revealed && $('#s3').classList.contains('on')) later(reveal,700);
}
setInterval(tick,1000); tick();

function reveal(){ if(revealed) return; revealed = true; show('s4'); $('#skip').style.display='none'; }

/* Escena 1 -> 2 -> 3 o revelación */
function typeLines(el, lines, cb){
  let li=0, ci=0, out='';
  (function step(){
    if(li>=lines.length){ later(cb,900); return; }
    const txt = lines[li];
    if(ci<txt.length){ out+=txt[ci++]; el.innerHTML = out.replace(/\[(.+?)\]/g,'<i>$1</i>')+'<span class="cursor"></span>'; later(step,28); }
    else { out+='\n'; li++; ci=0; later(step,320); }
  })();
}
function intro(){
  const caps = ['ESCANEANDO…','OBJETIVO DETECTADO','IDENTIFICANDO INVITADO…'];
  let c=0; const cap=$('#cap1');
  timers.push(setInterval(()=>{ cap.textContent = caps[Math.min(++c,2)]; },1600));
  later(()=>{ cap.textContent='ACCESO CONCEDIDO'; $('#s1').classList.add('hit'); },5000);
  later(()=>{ show('s2');
    const open = Date.now()>=T1;
    typeLines($('#lines'), open ? [
      '> CONEXIÓN SEGURA ESTABLECIDA',
      '> ARCHIVO: [CLASIFICADO]',
      '> DESENCRIPTANDO…',
      '',
      '> Acceso [parcial] concedido.'
    ] : [
      '> CONEXIÓN SEGURA ESTABLECIDA',
      '> ARCHIVO: [CLASIFICADO]',
      '> NIVEL DE ACCESO: INVITADO',
      '',
      '> Algo se está preparando.',
      '> Esta información todavía es [confidencial].'
    ], ()=> Date.now()>=T1 ? reveal() : show('s3'));
  },6300);
}
function skip(){ timers.forEach(t=>{clearTimeout(t);clearInterval(t)}); if(Date.now()>=T1) reveal(); else show('s3'); $('#skip').style.display='none'; }
$('#skip').addEventListener('click',skip);

if(params.has('reveal')){ reveal(); } else { intro(); }
</script>
</body>
</html>
